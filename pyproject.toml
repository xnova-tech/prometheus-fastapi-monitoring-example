[project]
name = "prometheus-fastapi-monitoring-example"
version = "0.1.0"
description = "Small FastAPI service instrumented for a Prometheus tutorial"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.2",
  "prometheus-client==0.25.0",
  "uvicorn==0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["ANN", "B", "E", "F", "I", "RUF", "SIM", "UP"]
